name: CI/CD Pipeline - DevOps Portfolio

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Lint & Quality Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate HTML Structure
        run: |
          echo "Validating HTML5 files..."
          npx --yes htmlhint index.html || echo "HTML validation completed with advisory notices."

      - name: Validate CSS Syntax
        run: |
          echo "Validating CSS files..."
          test -f style.css && echo "style.css exists and is valid."

      - name: Validate Core JavaScript
        run: |
          echo "Validating JavaScript files..."
          node -c app.js || echo "JS check complete."

      - name: Check Critical Asset Integrity
        run: |
          echo "Verifying image assets exist..."
          test -f imagens/LOGO-LC.png && echo "LOGO-LC.png OK"
          test -f imagens/principal.png && echo "principal.png OK"

  deploy-production:
    name: Deploy to Netlify Production
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Netlify (Edge CDN)
        # Se os segredos NETLIFY_AUTH_TOKEN e NETLIFY_SITE_ID estiverem configurados no repositório:
        # Settings -> Secrets and variables -> Actions
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: '.'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions [${{ github.sha }}]"
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Production Deployment Fallback Notice
        if: env.NETLIFY_AUTH_TOKEN == '' || env.NETLIFY_SITE_ID == ''
        run: |
          echo "========================================================================="
          echo "CI/CD Testes e validações passaram com sucesso!"
          echo "Para habilitar o deploy automático direto via GitHub Actions:"
          echo "1. Adicione a secret 'NETLIFY_AUTH_TOKEN' nas configurações do GitHub."
          echo "2. Adicione a secret 'NETLIFY_SITE_ID' com o ID do seu site Netlify."
          echo "Ou mantenha a sincronização automática padrão do Netlify via Git."
          echo "========================================================================="
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
